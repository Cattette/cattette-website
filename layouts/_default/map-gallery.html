{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="detailed-gallery">
  {{ range hugo.Data.maps.entries }}
      <div class="detailed-gallery-item">
        <a href="https://file.garden/amecZmyP7kt23Kzq/maps/{{ .img }}.png"><img class="detailed-gallery-image" src="/img/maps/{{ .img }}.jpg" alt="IMG_ID"></a>
        <div class="label">{{ .title}} </div>
        <hr>
        <div class="desc">{{ .desc}}<a href="/img/maps/{{ .img }}.txt">[...]</a></div>
        <hr>
        <span>Licence: </span><a href="{{ .licence_url }}">{{ .licence }}</a>
      </div>
  {{end}}
  </div>
{{ end }}
