<!-- this shortcode exists to create fancy images with captions -->
<!-- define our vars -->
{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "" }}
{{ $class := .Get "class" | default "" }}
{{ $caption := .Get "caption" | default "" }}
<!-- find src image -->
{{ $img := .Page.Resources.GetMatch $src }}

<!-- produce a thumbnail and a large version of the src image -->

<figure style="max-width: {{ $img.Width }}px;" class ="{{ $class }}" >
        <img
            src="{{ $img.RelPermalink }}"
            alt="{{ $alt }}"
            loading="eager"
            width="{{ $img.Width}}"
            height="{{ $img.Height}}"
        >
    <figcaption>{{ $caption }}</figcaption>
</figure>
